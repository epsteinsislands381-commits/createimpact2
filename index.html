<!DOCTYPE html>
<html>
<head>
  <title>CreateImpact Portal</title>
</head>
<body style="background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh;">
  <div id="auth-box" style="background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); width:100%; max-width:360px; text-align:center; font-family:sans-serif;">
    <h2 style="color:#222; margin-bottom:25px;">Sign In to CreateImpact</h2>
    <button id="google-login" style="width:100%; padding:12px; background:#4285F4; color:white; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer; margin-bottom:20px;">Sign in with Google</button>
    <div style="border-top:1px solid #eee; margin:10px 0 20px 0; position:relative;"><span style="background:white; padding:0 10px; position:absolute; top:-10px; left:50%; transform:translateX(-50%); color:#999; font-size:13px;">or</span></div>
    <div id="phone-step1">
      <input type="tel" id="phone" placeholder="+919876543210 (with country code)" style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:14px;">
      <button id="send-otp" style="width:100%; padding:12px; background:#3ecf8e; color:white; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer;">Send SMS Verify Code</button>
    </div>
    <div id="phone-step2" style="display:none;">
      <input type="text" id="otp" placeholder="Enter 6-digit SMS OTP" style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:14px;">
      <button id="verify-otp" style="width:100%; padding:12px; background:#2b2b2b; color:white; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer;">Verify & Login</button>
    </div>
    <div id="dashboard" style="display:none;">
      <p style="color:#333; font-size:15px; margin-bottom:20px;">Welcome back, <b id="user-display"></b>!</p>
      <button id="logout" style="width:100%; padding:12px; background:#ff4d4d; color:white; border:none; border-radius:6px; font-weight:bold; font-size:15px; cursor:pointer;">Sign Out</button>
    </div>
  </div>
  <script src="https://jsdelivr.net"></script>
  <script>
    const supabaseClient = supabase.createClient("https://acjkjrxnnceeyflukjyo.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjamtqcnhubmNlZXlmbHVranlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTU2MTksImV4cCI6MjEwNzg5MTYxOX0.a6xikgq6M0vrCX5mRJATNpdAvigkwUBzH0n8N-nZQUE");
    document.getElementById("google-login").addEventListener("click", async () => {
      await supabaseClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: "https://createimpact.in" } });
    });
    document.getElementById("send-otp").addEventListener("click", async () => {
      const num = document.getElementById("phone").value.trim();
      const { error } = await supabaseClient.auth.signInWithOtp({ phone: num });
      if(error) alert(error.message); else { alert("Code sent!"); document.getElementById("phone-step1").style.display="none"; document.getElementById("phone-step2").style.display="block"; }
    });
    document.getElementById("verify-otp").addEventListener("click", async () => {
      const num = document.getElementById("phone").value.trim();
      const code = document.getElementById("otp").value.trim();
      const { error } = await supabaseClient.auth.verifyOtp({ phone: num, token: code, type: "sms" });
      if(error) alert(error.message); else { alert("Login Success!"); window.location.reload(); }
    });
    supabaseClient.auth.onAuthStateChange((event, session) => {
      const user = session?.user;
      if(user) {
        document.getElementById("google-login").style.display="none";
        document.getElementById("phone-step1").style.display="none";
        document.getElementById("phone-step2").style.display="none";
        document.getElementById("dashboard").style.display="block";
        document.getElementById("user-display").innerText = user.email || user.phone;
      } else {
        document.getElementById("google-login").style.display="block";
        document.getElementById("phone-step1").style.display="block";
        document.getElementById("dashboard").style.display="none";
      }
    });
    document.getElementById("logout").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
  </script>
</body>
</html>
