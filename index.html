<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreateImpact Portal</title>
  <!-- Official Fully Qualified Supabase CDN Library Engine Link -->
  <script src="https://jsdelivr.net"></script>
</head>
<body style="background:#0f172a; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family:sans-serif; color:#f8fafc;">
  
  <!-- OUTSIDE GUEST LOGIN VIEW -->
  <div id="auth-box" style="background:#1e293b; padding:35px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.3); width:100%; max-width:360px; text-align:center; border:1px solid #334155;">
    <h2 style="color:#fff; margin-bottom:10px; font-size:24px;">Welcome</h2>
    <p style="color:#94a3b8; font-size:14px; margin-bottom:25px;">Sign in to access the platform</p>
    
    <!-- Google Authentication Anchor -->
    <button id="google-login" style="width:100%; padding:12px; background:#4285F4; color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; margin-bottom:20px; box-sizing:border-box;">
      Sign in with Google
    </button>
    
    <div style="border-top:1px solid #334155; margin:15px 0 25px 0; position:relative;"><span style="background:#1e293b; padding:0 10px; position:absolute; top:-10px; left:50%; transform:translateX(-50%); color:#64748b; font-size:13px;">or</span></div>
    
    <!-- Phone Authentication Interface Blocks -->
    <div id="phone-step1">
      <input type="tel" id="phone" placeholder="+919876543210" style="width:100%; padding:12px; margin-bottom:12px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:8px; box-sizing:border-box; font-size:14px; outline:none;">
      <button id="send-otp" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer;">Send Verification SMS</button>
    </div>
    
    <div id="phone-step2" style="display:none;">
      <input type="text" id="otp" placeholder="Enter 6-digit SMS OTP" style="width:100%; padding:12px; margin-bottom:12px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:8px; box-sizing:border-box; font-size:14px; outline:none;">
      <button id="verify-otp" style="width:100%; padding:12px; background:#475569; color:white; border:none; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer;">Verify OTP</button>
    </div>
  </div>

  <script>
    // Extract connection clients accurately from global window object map
    const { createClient } = window.supabase || {};
    
    if (!createClient) {
      console.error("Supabase CDN library did not load correctly.");
      alert("Network Error: Could not connect to core security layers. Please reload the page.");
    } else {
      const supabaseUrl = "https://supabase.co";
      const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjamtqcnhubmNlZXlmbHVranlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTU2MTksImV4cCI6MjEwNzg5MTYxOX0.a6xikgq6M0vrCX5mRJATNpdAvigkwUBzH0n8N-nZQUE";
      
      const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);
      
      // Trigger Google Provider redirection on click listener routing maps
      document.getElementById("google-login").addEventListener("click", async () => {
        await supabaseClient.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: "https://createimpact.in" }
        });
      });
      
      // Request SMS One-Time-Password delivery mapping
      document.getElementById("send-otp").addEventListener("click", async () => {
        const num = document.getElementById("phone").value.trim();
        if (!num) return alert("Please enter a phone number with country code.");
        
        const { error } = await supabaseClient.auth.signInWithOtp({ phone: num });
        if (error) {
          alert("SMS Error: " + error.message);
        } else {
          alert("Verification token sent to your device!");
          document.getElementById("phone-step1").style.display = "none";
          document.getElementById("phone-step2").style.display = "block";
        }
      });
      
      // Verify input verification token parameters against database engine
      document.getElementById("verify-otp").addEventListener("click", async () => {
        const num = document.getElementById("phone").value.trim();
        const token = document.getElementById("otp").value.trim();
        if (!token) return alert("Please enter the 6-digit code.");
        
        const { error } = await supabaseClient.auth.verifyOtp({ phone: num, token: token, type: "sms" });
        if (error) alert("Invalid Token: " + error.message);
      });
      
      // Listen for authenticated sessions to execute immediate structural routing rules
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          window.location.replace("app.html");
        }
      });
    }
  </script>
</body>
</html>
